<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101512" media="(prefers-color-scheme: dark)" />
    <title>轻记账 · 离线</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: #20201d; background: #f4f1eb; }
      main { width: min(82vw, 360px); padding: 32px; border-radius: 28px; background: #fffdf9; box-shadow: 0 18px 60px rgba(66,52,36,.12); text-align: center; }
      span { display: grid; width: 58px; height: 58px; margin: 0 auto 18px; place-items: center; border-radius: 18px; color: white; background: #ef7453; font-size: 24px; font-weight: 800; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 10px 0 20px; color: #77746d; font-size: 14px; line-height: 1.6; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 14px; color: white; background: #ef7453; font: inherit; font-weight: 800; }
      @media (prefers-color-scheme: dark) {
        body { color: #f2f5f3; background: #101512; }
        main { background: #19201c; box-shadow: 0 18px 60px rgba(0,0,0,.3); }
        p { color: #9aa59f; }
      }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true">记</span>
      <h1>暂时无法打开应用</h1>
      <p>首次离线使用前，请在联网状态下完整打开一次轻记账。已有账本数据仍安全保存在本机。</p>
      <button type="button" onclick="location.reload()">重新尝试</button>
    </main>
  </body>
</html>
